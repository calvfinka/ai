<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - GoWithDME AI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">✦ GoWithDME AI</div>
      <h2>Masuk ke GoWithDME AI</h2>
      <p class="auth-sub">Lanjut rencanain pendakian &amp; konsermu.</p>

      <p id="authMsg" class="auth-msg" role="alert" hidden></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" type="password" autocomplete="current-password">
            <button type="button" id="pwToggle" class="pw-toggle" aria-pressed="false">Lihat Password</button>
          </div>
        </div>
        <p class="forgot"><a href="#" id="forgotLink">Lupa password?</a></p>
        <button type="submit" class="btn-main">Masuk</button>
      </form>

      <div class="divider">atau lanjut dengan</div>
      <button type="button" id="googleBtn" class="btn-outline">Lanjut dengan Google</button>

      <div class="auth-links">
        <span>Belum punya akun? <a href="register.html">Daftar</a></span>
      </div>
      <a href="index.html" class="btn-outline auth-back">Kembali ke Beranda</a>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
