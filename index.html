<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1210" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)">
  <meta name="description" content="Asisten AI GoWithDME: susun itinerary gunung, konser, dan trip dengan estimasi biaya dan perlengkapan.">
  <link rel="canonical" href="https://ai.gowithdme.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231bb985'/%3E%3Cstop offset='1' stop-color='%230e8f9a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 6l2.2 6.3L24.5 14.5l-6.3 2.2L16 23l-2.2-6.3L7.5 14.5l6.3-2.2z' fill='white'/%3E%3C/svg%3E">
  <title>AI — GoWithDME</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="https://gowithdme.com/" title="Kembali ke GoWithDME"><span class="logo-dot"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>GoWithDME <span class="accent">AI</span></a>
      <div class="bar-actions">
        <button type="button" class="btn-icon" id="historyBtn" aria-label="Riwayat chat" title="Riwayat">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button type="button" class="btn-icon" id="newBtn" aria-label="Chat baru" title="Chat baru">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div class="modes" id="modes" role="tablist" aria-label="Mode" data-i="0"><i class="pill" aria-hidden="true"></i>
      <button type="button" role="tab" data-mode="gunung">Gunung</button>
      <button type="button" role="tab" data-mode="konser">Konser</button>
      <button type="button" role="tab" data-mode="trip">Trip</button>
    </div>

    <main class="msgs" id="msgs" aria-live="polite"></main>

    <footer class="dock">
      <form class="composer" id="form">
        <textarea id="input" rows="1" aria-label="Pesan" placeholder="Tulis rencana perjalananmu…"></textarea>
        <button type="submit" class="send" id="sendBtn" aria-label="Kirim">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint">AI bisa keliru. Cek sumber resmi sebelum berangkat.</p>
    </footer>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-card" role="dialog" aria-label="Riwayat chat">
      <div class="drawer-head">
        <h2>Riwayat</h2>
        <button type="button" class="btn-icon" id="closeDrawer" aria-label="Tutup">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="histList"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
